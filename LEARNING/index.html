<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Fest Registrations</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>      

    <h1> Welcome to Inventum 2k25 </h1>

    <form action="/fest/home/register" method="post">
    <label for="username">Enter your Name : </label>
    <input type="text" name="username" id="username" required><br>

    <label for="mail">Enter your Email : </label>
    <input type="email" name="email" id="mail" required><br>

    <label for="number">Enter your Number : </label>
    <input type="number" name="number" id="number" required><br>

    <label for="rollno">Enter your Roll No : </label>
    <input type="text" name="rollno" id="rollno" required><br>

    <label for="year">Select your Year : </label>
    <br>
    <input type="radio" name="year" id="year" value="1st year"> 1st Year<br>
    <input type="radio" name="year" id="year" value="2nd yera"> 2nd Year<br>
    <input type="radio" name="year" id="year" value="3rd year"> 3rd Year<br>
    <input type="radio" name="year" id="year" value="4th year"> 4th Year<br>

    <label for="branch">Select your Branch : </label>
    <select name="branch" id="branch">
        <option value="csm"> CSM </option>
        <option value="csd"> CSD </option>
        <option value="core"> CSE </option>
        <option value="it"> IT </option>
        <option value="ece"> ECE </option>
        <option value="eee"> EEE </option>
        <option value="mech">MECH</option>
        <option value="civil">CIVIL</option>
        <option value="chemical">chemical</option>
    </select>
    <br>

    <label for="session">Select your Session : </label>
    <select name="session" id="session">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
    </select>
    <br>

    <div class="events">
        <label for="events">Select Participating Event : </label><br>
        <input type="checkbox" name="events[]" id="events" value="Coding"> Coding <br>
        <input type="checkbox" name="events[]" id="events" value="Quiz"> Quiz <br>
        <input type="checkbox" name="events[]" id="events" value="Poster"> Poster Designing <br>
        <input type="checkbox" name="events[]" id="events" value="Project"> Project <br>
    </div>

    <button type="submit" name="submit" value="submit" id="submit">Submit</button>
    </form>

</body>
</html>
